<!DOCTYPE html>
<html>
<head>
 <title>javasript output</title>
</head>
<body>

<h2>javascript output methods</h2>

<p id="output"></p>

<script>
 //1.Using innerHTML
 document.getElementById("output").innerHTML=
  "1.Output using innerHTML";

 //2.Using document.write()
 document.write("<br>2. Output using document.write()");

 // 3. Using alert()
 window.alert("3. Output using alert()");

 // 4. Using console.log()
 console.log("4. Output using console.log()");
</script>

</body>
</html>
